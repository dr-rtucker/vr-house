<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0a09">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>House VR</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a09; }
  canvas { display: block; }
  #ui { position: fixed; inset: auto 0 0 0; padding: 18px; display: flex; justify-content: center;
        pointer-events: none; font: 500 15px/1.4 system-ui, -apple-system, sans-serif; }
  button { pointer-events: auto; font: inherit; padding: 14px 22px; border: 0; border-radius: 999px;
           background: #f0e9df; color: #191512; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #hint { position: fixed; top: 0; left: 0; right: 0; padding: 16px; text-align: center;
          color: #e8e0d4; pointer-events: none; text-shadow: 0 1px 4px #000;
          font: 400 13px/1.5 system-ui, -apple-system, sans-serif; }
  #room { position: fixed; top: 44px; left: 0; right: 0; text-align: center; pointer-events: none;
          color: #fff; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .5s;
          font: 600 20px/1 system-ui, -apple-system, sans-serif; letter-spacing: .04em; }
</style>
</head>
<body>
<div id="hint"></div>
<div id="room"></div>
<div id="ui"><button id="vr" disabled>checking VR…</button></div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js" } }
</script>

<script type="module">
import * as THREE from 'three';
import { buildHouse } from './scene-house.js';

// Geometry, materials and lighting now live in scene-house.js so study.html can
// render the identical house.
const { scene, ROOMS, doorPivot, tvLight, screenUniforms,
        resolve, floorHeight, EYE, WALK, MAXZ } = buildHouse();

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
// The sun is fixed and the house is static, so the shadow map is not worth
// rebuilding 90 objects deep on every frame. Render it once; the animation loop
// re-flags it only while the front door is mid-swing.
renderer.shadowMap.autoUpdate = false;
renderer.shadowMap.needsUpdate = true;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.12, 160);
const player = new THREE.Group();
player.add(camera);
scene.add(player);
player.position.set(2.5, 0, 6.2);            // on the path, facing the front door
camera.position.y = EYE;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ================================================================ perf readout
// Opt in with ?stats — worth measuring before trading away any of the lighting.
const statsEl = new URLSearchParams(location.search).has('stats')
  ? document.body.appendChild(Object.assign(document.createElement('div'), {
      style: 'position:fixed;top:8px;left:8px;z-index:9;padding:6px 9px;background:#000a;' +
             'color:#8f8;font:12px/1.45 ui-monospace,monospace;white-space:pre;' +
             'border-radius:6px;pointer-events:none'
    }))
  : null;
let statsAcc = 0, statsFrames = 0;

const roomEl = document.getElementById('room');
let lastRoom = '';
let roomTimer = 0;

// ================================================================ controls
const keys = new Set();
let yaw = 0, pitch = 0, gazeWalk = false;
addEventListener('keydown', e => keys.add(e.code));
addEventListener('keyup',   e => keys.delete(e.code));
renderer.domElement.addEventListener('click', () => {
  if (!renderer.xr.isPresenting) renderer.domElement.requestPointerLock();
});
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.0022;
  pitch = Math.max(-1.5, Math.min(1.5, pitch - e.movementY * 0.0022));
});
let touchPrev = null, touchMoved = false;
renderer.domElement.addEventListener('touchstart', e => {
  touchPrev = { x: e.touches[0].clientX, y: e.touches[0].clientY }; touchMoved = false;
}, { passive: true });
renderer.domElement.addEventListener('touchmove', e => {
  if (!touchPrev) return;
  const t = e.touches[0];
  yaw -= (t.clientX - touchPrev.x) * 0.005;
  pitch = Math.max(-1.5, Math.min(1.5, pitch - (t.clientY - touchPrev.y) * 0.005));
  touchPrev = { x: t.clientX, y: t.clientY }; touchMoved = true;
}, { passive: true });
renderer.domElement.addEventListener('touchend', () => {
  if (!touchMoved) gazeWalk = !gazeWalk;
  touchPrev = null;
}, { passive: true });

// ================================================================ Enter VR
const btn = document.getElementById('vr'), hint = document.getElementById('hint');
const baseHint = matchMedia('(pointer: coarse)').matches
  ? 'drag to look · tap to walk · “Enter VR” for the headset'
  : 'click to look · WASD to walk · “Enter VR” for the headset';
hint.textContent = baseHint;

if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    if (!ok) { btn.textContent = 'VR not available here'; return; }
    btn.disabled = false; btn.textContent = 'Enter VR';
    btn.onclick = async () => {
      if (renderer.xr.isPresenting) { renderer.xr.getSession().end(); return; }
      const s = await navigator.xr.requestSession('immersive-vr',
                  { optionalFeatures: ['local-floor', 'viewer'] });
      s.addEventListener('selectstart', () => gazeWalk = true);
      s.addEventListener('selectend',   () => gazeWalk = false);
      s.addEventListener('end', () => { btn.textContent = 'Enter VR'; hint.textContent = baseHint; gazeWalk = false; });
      await renderer.xr.setSession(s);
      btn.textContent = 'Exit VR'; hint.textContent = '';
    };
  });
} else btn.textContent = 'no WebXR in this browser';

// ================================================================ loop
// dev viewpoint override: ?at=x,y,z&yaw=..&pitch=..
{
  const q = new URLSearchParams(location.search);
  if (q.has('at')) { const a = q.get('at').split(',').map(Number); player.position.set(a[0], a[1], a[2]); }
  if (q.has('yaw')) yaw = parseFloat(q.get('yaw'));
  if (q.has('pitch')) pitch = parseFloat(q.get('pitch'));
}

const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), headQ = new THREE.Quaternion();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  screenUniforms.uTime.value += dt;
  const t = screenUniforms.uTime.value * 0.25;
  tvLight.color.setRGB(0.35 + 0.2 * Math.sin(t * 1.1), 0.5 + 0.15 * Math.sin(t * 1.7 + 1.0), 0.95);

  // front door swings open as you reach it
  const dp = player.position;
  const nearDoor = dp.y < 1.0 && Math.hypot(dp.x - 2.5, dp.z - MAXZ) < 2.2;
  const wanted = nearDoor ? Math.PI * 0.62 : 0;   // swings inward, away from you
  const doorWas = doorPivot.rotation.y;
  doorPivot.rotation.y += (wanted - doorPivot.rotation.y) * Math.min(1, dt * 3.5);
  if (Math.abs(doorPivot.rotation.y - doorWas) > 1e-4) renderer.shadowMap.needsUpdate = true;

  if (!renderer.xr.isPresenting) {
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
    camera.position.y = EYE;
  }
  renderer.xr.isPresenting ? renderer.xr.getCamera().getWorldQuaternion(headQ)
                           : camera.getWorldQuaternion(headQ);
  fwd.set(0, 0, -1).applyQuaternion(headQ);  fwd.y = 0;  fwd.normalize();
  right.set(1, 0, 0).applyQuaternion(headQ); right.y = 0; right.normalize();

  let move = 0, strafe = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    move += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  move -= 1;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  strafe -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) strafe += 1;
  if (gazeWalk) move += 1;

  if (move || strafe) {
    player.position.addScaledVector(fwd, move * WALK * dt);
    player.position.addScaledVector(right, strafe * WALK * dt);
    resolve(player.position, player.position.y);
  }

  // settle onto whatever is underfoot: ground, stair tread, or upper floor
  const target = floorHeight(player.position, player.position.y);
  player.position.y += (target - player.position.y) * Math.min(1, dt * 14);

  // room caption
  roomTimer -= dt;
  const here = ROOMS.find(r => r.test(player.position)).name;
  if (here !== lastRoom) { lastRoom = here; roomEl.textContent = here; roomEl.style.opacity = 1; roomTimer = 2.2; }
  else if (roomTimer <= 0) roomEl.style.opacity = 0;

  renderer.render(scene, camera);

  if (statsEl) {
    statsAcc += dt; statsFrames++;
    if (statsAcc >= 0.5) {
      const info = renderer.info;
      statsEl.textContent = `${(statsFrames / statsAcc).toFixed(0)} fps
${info.render.calls} draw calls
${(info.render.triangles / 1000).toFixed(1)}k tris
${info.programs.length} shaders`;
      statsAcc = 0; statsFrames = 0;
    }
  }
});
</script>
<script>
  // Classic script, not a module: registration should still happen if the scene
  // module above fails to parse on an older phone browser.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(e => console.warn('sw:', e));
    });
  }
</script>
</body>
</html>
